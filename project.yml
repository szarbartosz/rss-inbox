name: RSSInbox
options:
  bundleIdPrefix: com.szarbartosz
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  RSSInbox:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RSSInbox
    resources:
      - path: RSSInbox/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szarbartosz.rss-inbox
        INFOPLIST_FILE: RSSInbox/Info.plist
        CODE_SIGN_ENTITLEMENTS: RSSInbox/RSSInbox.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RSSInboxTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RSSInboxTests
    dependencies:
      - target: RSSInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szarbartosz.rss-inbox.tests
        GENERATE_INFOPLIST_FILE: YES
