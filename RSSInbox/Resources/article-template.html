<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: #e0e0e0;
    background: #1c1c1e;
    padding: 24px 28px;
    max-width: 680px;
    margin: 0 auto;
  }
  @media (prefers-color-scheme: light) {
    body { color: #1c1c1e; background: #ffffff; }
    a { color: #007AFF; }
  }
  a { color: #0A84FF; text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; height: auto; border-radius: 8px; margin: 8px 0; }
  pre { background: #2c2c2e; border-radius: 6px; padding: 12px; overflow-x: auto; }
  code { background: #2c2c2e; border-radius: 3px; padding: 1px 5px; font-family: monospace; font-size: 12px; }
  pre code { background: transparent; padding: 0; }
  blockquote { border-left: 3px solid #555; margin: 0; padding-left: 16px; color: #888; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
